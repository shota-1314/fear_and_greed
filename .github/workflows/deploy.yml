name: Deploy to Shin VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            cd /var/www/fear_and_greed_new

            git pull origin main

            if [ ! -d venv ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

            chmod +x scripts/install_cron.sh
            PROJECT_DIR=/var/www/fear_and_greed_new scripts/install_cron.sh

            if systemctl list-unit-files | grep -q '^fgi-api.service'; then
              sudo systemctl restart fgi-api
            fi

            echo "Deployment completed successfully!"
